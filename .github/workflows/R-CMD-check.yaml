# .github/workflows/R-CMD-check.yaml
on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master
      - '**'

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macOS-latest,   r: 'release',  rtools: '' }
          - { os: windows-latest, r: 'release',  rtools: '42' }
          - { os: ubuntu-22.04,   r: 'devel',    rtools: '' }
          - { os: ubuntu-22.04,   r: 'release',  rtools: '' }
          - { os: ubuntu-22.04,   r: 'oldrel-1', rtools: '' }

    env:
      GITHUB_PAT:       ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN:         true

    steps:
      - uses: actions/checkout@v4

      - uses: n1hility/cancel-previous-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: latest

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version:     ${{ matrix.config.r }}
          rtools-version: ${{ matrix.config.rtools }}
          use-public-rspm: true

      # ── 1. Install R package dependencies via pak ─────────────────────────
      - name: Install R deps via pak
        run: |
          install.packages("pak", repos = "https://cran.rstudio.com")
          pak::pkg_install(c(
            # CRAN packages needed for check/tests
            "colorspace",
            "R.rsp",
            "knitr",
            "rcmdcheck",
            "rmarkdown",
            "testthat",
            "projpred",
            "priorsense",
            "RWiener",
            "rtdists",
            "extraDistr",
            "statmod",
            "diffobj",
            # Stan backend from r-universe
            "stan-dev/cmdstanr"
          ))
        shell: Rscript {0}

      # ── 2. Cache & build CmdStan ───────────────────────────────────────────
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ matrix.config.r }}

      - name: Build CmdStan
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = parallel::detectCores())
        shell: Rscript {0}

      # ── 3. Run R CMD check ─────────────────────────────────────────────────
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args:       'c("--no-manual", "--as-cran", "--ignore-vignettes")'

      # ── 4. Upload check artefacts ──────────────────────────────────────────
      - name: Upload R CMD check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-check-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
